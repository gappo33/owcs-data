name: OWCS archive update
on:
  workflow_dispatch:
  schedule:
    - cron: '37 1 * * *'
permissions:
  contents: write
concurrency:
  group: owcs-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Parser self-test
        run: python owcs_parsers.py --self-test && python test_archive.py
      - name: Collect incremental archive
        env:
          LIQUIPEDIA_CONTACT: ${{ secrets.LIQUIPEDIA_CONTACT }}
          OWCS_PARSE_BUDGET: '4'
        run: python collect_all.py
      - name: Commit archive
        run: |
          git config user.name owcs-data-bot
          git config user.email owcs-data-bot@users.noreply.github.com
          git add data/owcs_all.json
          git diff --cached --quiet || (git commit -m 'Update OWCS archive' && git push)
      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owcs-archive-debug
          path: data/archive_debug/
          if-no-files-found: ignore
          retention-days: 3
